name: Nix

on:
  push:
    branches: [master, feat/quic-endpoint]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cloudtide
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build Herdr
        run: nix build .#herdr --print-build-logs

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            target-${{ runner.os }}-

      - name: Unit and integration tests
        run: >-
          nix develop --command env LIBGHOSTTY_VT_OPTIMIZE=ReleaseSafe
          cargo nextest run --locked --no-fail-fast
          --status-level fail --final-status-level slow
          --failure-output final --success-output never

      - name: Maintenance and asset contracts
        if: always()
        run: |
          nix develop --command just maintenance-test
          nix develop --command just ui-hot-path-architecture-test
          nix develop --command just integration-assets-test
          nix develop --command just docs-contract-test
