name: Nix

on:
  push:
    branches: [master, feat/quic-endpoint]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      CODESIGN_P12_B64: ${{ secrets.HERDR_CODESIGN_P12_B64 }}
      CODESIGN_P12_PASSWORD: ${{ secrets.HERDR_CODESIGN_P12_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v15
        with:
          name: cloudtide
          signingKey: ${{ secrets.CACHIX_SIGNING_KEY }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Materialize codesigning identity
        if: matrix.name == 'darwin' && env.CODESIGN_P12_B64 != ''
        run: |
          set -euo pipefail
          d=/tmp/herdr-codesign
          # World-readable on purpose: with a multi-user Nix install the
          # builder runs as an _nixbld* user, not as the runner.
          install -d -m 0755 "$d"
          printf '%s' "$CODESIGN_P12_B64" | base64 --decode > "$d/identity.p12"
          printf '%s' "$CODESIGN_P12_PASSWORD" > "$d/password"
          chmod 0644 "$d/identity.p12" "$d/password"
          {
            echo "HERDR_CODESIGN_P12=$d/identity.p12"
            echo "HERDR_CODESIGN_P12_PASSWORD_FILE=$d/password"
            echo "HERDR_CODESIGN_KEY_ID=$(shasum -a 256 "$d/identity.p12" | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - name: Build Herdr
        run: nix build .#herdr --print-build-logs --impure

      - name: Verify signature
        if: matrix.name == 'darwin' && env.CODESIGN_P12_B64 != ''
        run: |
          set -euo pipefail
          bin=$(readlink -f result/bin/herdr)
          echo "binary: $bin"
          info=$(codesign -dvvv "$bin" 2>&1)
          echo "$info"
          req=$(codesign -d -r- "$bin" 2>&1)
          echo "$req"
          codesign --verify --strict "$bin"
          grep -q '^Authority=' <<<"$info" \
            || { echo "not signed with a certificate" >&2; exit 1; }
          if grep -q '^Signature=adhoc$' <<<"$info"; then
            echo "still ad-hoc signed" >&2; exit 1
          fi
          grep -q 'certificate' <<<"$req" \
            || { echo "designated requirement is not certificate-anchored; TCC grants would not survive upgrades" >&2; exit 1; }
          "$bin" --version

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            always-allow-substitutes = true

      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            target-${{ runner.os }}-

      - name: Unit and integration tests
        run: >-
          nix develop --command env LIBGHOSTTY_VT_OPTIMIZE=ReleaseSafe
          cargo nextest run --locked --no-fail-fast
          --status-level fail --final-status-level slow
          --failure-output final --success-output never

      - name: Maintenance and asset contracts
        if: always()
        run: |
          nix develop --command just maintenance-test
          nix develop --command just ui-hot-path-architecture-test
          nix develop --command just integration-assets-test
          nix develop --command just docs-contract-test
